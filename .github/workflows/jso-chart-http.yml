name: JSO HTTP chart

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ClientPlugins/JsoChartEditor/**
      - Plugin/JsoChartBridge/**
      - ShootingOperationsPackages/JsoChartEditor/**
      - .github/workflows/jso-chart-http.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: JENN2046/VCPChat
          ref: 5af217ad99091e673060c2540ebf8db5bda69223
          path: .test-host
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Install isolated DOM test dependency
        run: npm install --prefix "$RUNNER_TEMP/jso-chart-tests" --no-save --ignore-scripts --no-audit --no-fund jsdom@24.1.3
      - name: Run editor and Save concurrency tests against merged Chat
        env:
          JSO_CHART_TEST_CHAT_ROOT: ${{ github.workspace }}/.test-host
        run: NODE_PATH="$RUNNER_TEMP/jso-chart-tests/node_modules" node --test ShootingOperationsPackages/JsoChartEditor/*.test.cjs
