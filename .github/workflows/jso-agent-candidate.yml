name: JSO Agent Extensions candidate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jso-agent-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    strategy:
      fail-fast: false
      matrix:
        mode: [accepted, candidate]
    uses: JENN2046/VCPToolBox-JENN-Extensions/.github/workflows/jso-agent-paired.yml@a6c7d447ddaa29799c60aa109d5119b102d1eae4
    with:
      harness_sha: a6c7d447ddaa29799c60aa109d5119b102d1eae4
      mode: ${{ matrix.mode }}
      candidate_component: ${{ matrix.mode == 'candidate' && 'extensions' || '' }}
      candidate_repository: ${{ matrix.mode == 'candidate' && 'JENN2046/VCPToolBox-JENN-Extensions' || '' }}
      candidate_sha: ${{ matrix.mode == 'candidate' && (github.event.pull_request.head.sha || github.sha) || '' }}
