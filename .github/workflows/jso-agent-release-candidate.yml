name: JSO Agent R2 canonical promotion

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jso-agent-r2b-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  promotion:
    uses: JENN2046/VCPToolBox-JENN-Extensions/.github/workflows/jso-agent-promotion.yml@7d071c5eb00822052ee0e11dc64c1b8e440fb715
    with:
      candidate_sha: ${{ github.event.pull_request.head.sha || github.sha }}
